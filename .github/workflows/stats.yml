name: Update Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cards take ivanwng97.com's own palette from its theme.css, so they can't drift from the
      # site: its first :root block is the light theme, its second the dark one.
      - name: Read the site's palette
        id: palette
        run: |
          curl -fsS https://ivanwng97.com/theme.css | tr -d '\n' | grep -o ':root *{[^}]*}' > roots
          for theme in light:1 dark:2; do
            block=$(sed -n "${theme#*:}p" roots)
            for token in sky-low accent muted; do
              hex=$(grep -o -- "--$token: *#[0-9a-fA-F]\{6\}" <<<"$block" | grep -o '[0-9a-fA-F]\{6\}$')
              echo "${theme%%:*}-$token=$hex" >> "$GITHUB_OUTPUT"
            done
          done

      # Light and dark, which README's <picture> picks between.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&border_radius=18&bg_color=${{ steps.palette.outputs.light-sky-low }}&title_color=${{ steps.palette.outputs.light-accent }}&icon_color=${{ steps.palette.outputs.light-accent }}&text_color=${{ steps.palette.outputs.light-muted }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&border_radius=18&bg_color=${{ steps.palette.outputs.dark-sky-low }}&title_color=${{ steps.palette.outputs.dark-accent }}&icon_color=${{ steps.palette.outputs.dark-accent }}&text_color=${{ steps.palette.outputs.dark-muted }}
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
